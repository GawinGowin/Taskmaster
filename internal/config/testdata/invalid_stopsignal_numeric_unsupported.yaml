# 期待: エラー "line N: unsupported stopsignal: 11"
# 狙い: ホワイトリストが数値パスにこそ効くこと。
#   範囲チェック（1 <= x <= SIGRTMAX）にすると 11(SEGV) が通ってしまい、
#   availableSignal が飾りになる。数値もホワイトリストの値と照合する。
#   なお syscall.SIGRTMAX は Go の syscall に存在しない（実測）ので、
#   そもそも範囲チェックは書けなかった
programs:
  p:
    cmd: /bin/true
    stopsignal: 11
