# 期待: 【エラーにならず、既定の TERM のまま】（実測で確認済み）
# 狙い: yaml.v3 は null ノードを短絡するので Stopsignal.UnmarshalYAML が呼ばれない。
#   Program.UnmarshalYAML が plain にセットした既定値 TERM がそのまま残る。
#   つまり「stopsignal: と書いて値を忘れた」は黙って TERM になる。
#   これをエラーにしたいなら Stopsignal 側では観測できず、Program 側で
#   yaml.Node の Tag == "!!null" を見る二段構えが要る
programs:
  p:
    cmd: /bin/true
    stopsignal:
