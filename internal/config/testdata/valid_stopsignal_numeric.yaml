# 期待: 成功 / 各 program の Stopsignal が対応する syscall.Signal になる
# 狙い: 数値表記も受けること。一度は「表記ゆれのテストコストが表記の数だけ増える」
#   という理由で棄却したが、数値は表記ゆれ（term / SigTerm）ではなく別の入力形式で、
#   そこを一緒くたにしていた。
#   数値もホワイトリストと照合するので、SEGV(11) のような値は
#   invalid_stopsignal_numeric_unsupported.yaml のとおり弾かれる。
#   番号は Linux の値（signal(7) の x86/ARM 系）。GOOS を跨ぐなら固定できない
programs:
  term:
    cmd: /bin/true
    stopsignal: 15
  hup:
    cmd: /bin/true
    stopsignal: 1
  kill:
    cmd: /bin/true
    stopsignal: 9
