# 期待: 成功 / 各 program の Stopsignal が対応する syscall.Signal になる
# 狙い: ADR-016 の 2026-09-09 追記1 で決定1 を覆し、数値表記を受けることにした。
#   棄却時の理由は「表記ゆれのテストコストが表記の数だけ増える」だったが、
#   数値は表記ゆれ（term / SigTerm）ではなく別の入力形式なので、そこを一緒くたにしていた。
#   数値も決定3 のホワイトリストと照合するので、SEGV(11) のような値は
#   invalid_stopsignal_numeric_unsupported.yaml のとおり弾かれる。
#   番号は Linux の値（signal(7) の x86/ARM 系）。GOOS を跨ぐなら固定できない
programs:
  term:
    cmd: /bin/true
    stopsignal: 15
  hup:
    cmd: /bin/true
    stopsignal: 1
  kill:
    cmd: /bin/true
    stopsignal: 9
