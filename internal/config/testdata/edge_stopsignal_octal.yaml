# 期待: 【成功し、Stopsignal == syscall.SIGKILL(9)】= 書き手の意図とはたぶん違う
# 狙い: ADR-016 追記1 の実測表にある罠を固定する。yaml.v3 は YAML 1.1 の
#   「先頭ゼロ = 8 進」を残しているので、011 は 11 ではなく 9 になる。
#   つまり SIGSEGV のつもりで書いた設定が SIGKILL として通る。
#   M-1 に「umask は引用符なしの 022 を 8 進で受けられる」と*利点として*記録してある挙動が、
#   stopsignal では罠として効く。同じパーサの同じ性質がフィールドによって逆符号の意味を持つ。
#   ADR-016 では未解決（9 と読むか / Atoi で 11 と読むか / エラーにするか）。
#   このファイルは「いまはこう読んでいる」を固定するためのもので、
#   仕様を変えるならここが赤くなって気づける
programs:
  p:
    cmd: /bin/true
    stopsignal: 011
