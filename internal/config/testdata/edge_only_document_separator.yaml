# 期待: エラー（空ファイルと同じ扱い）
# 狙い: --- だけのファイルは「中身が null のドキュメントが 1 個」になる。
#   ドキュメント数は 1 なので複数検出には引っかからず、io.EOF にもならないので
#   空ファイルの判定もすり抜ける。**両方の網の隙間**にあたる。
#   利用者から見れば「設定を全部消した」で空ファイルと同じなので、同じエラーにする。
#
#   デコード後の Config は edge_programs_null.yaml と同一（Programs == nil）なので、
#   struct を見て区別することはできない。ドキュメントの root が null であることを見る:
#     var cfg *Config; d.Decode(&cfg)  -> --- だけなら cfg == nil（実測）
#   ポインタで受けると programs: (null) / programs: {} は非 nil のままなので、
#   「programs が空の設定を許すか」の判断を巻き込まない
