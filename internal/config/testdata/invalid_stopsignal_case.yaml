# 期待: エラー "line N: unknown stopsignal \"term\""
# 狙い: シグナル名の大文字小文字を区別すること。
#   本家 supervisord は strip().upper() するので term も通るが、こちらは通さない。
#   SIG 接頭辞は許しているのに大文字小文字は許さないのは、根拠が違うため:
#     - SIGTERM は signal(7) に載っている OS 側の正式名称。TERM のほうが supervisord 側の略記。
#       つまり接頭辞を受けるのは「表記ゆれの吸収」ではなく「OS の語彙の受け入れ」
#     - term は正当化の根拠が無い純粋な表記ゆれ。autorestart と揃えて拒否する
#       （invalid_autorestart_case.yaml と同じ判断）
programs:
  p:
    cmd: /bin/true
    stopsignal: term
