# 期待: エラー "line N: unsupported stopsignal: 0"
# 狙い: 「Stopsignal のゼロ値が危険」という未解決の問題に対して、
#   せめて設定ファイル側からは 0 を書き込めない状態にしておく。
#   syscall.Signal(0) は kill(2) では「シグナルを送らず存在確認だけ」なので、
#   停止処理に流れるとエラーも出ずにプロセスが止まらない。
#   0 はホワイトリストに無いので数値パスの照合で自然に弾かれる（専用の分岐は要らない）
programs:
  p:
    cmd: /bin/true
    stopsignal: 0
