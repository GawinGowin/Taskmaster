; taskmaster の挙動を比較するためのリファレンス実装 (supervisor 4.3.0) 用設定。
; %(here)s = このファイルのあるディレクトリ。
;   起動: supervisord -c configs/supervisord.conf
;   制御: supervisorctl -c configs/supervisord.conf status
;   停止: supervisorctl -c configs/supervisord.conf shutdown

[unix_http_server]
; AF_UNIX のパス長制限(108文字)に引っかからないよう、深いパスには置かない
file=/tmp/taskmaster-supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/../logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(here)s/../logs/supervisord.pid
childlogdir=%(here)s/../logs
loglevel=info
nodaemon=false

; supervisorctl を使うために必須。消してはいけない
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/taskmaster-supervisor.sock

; --- 正常系: 起動して生き続けるだけのプロセス ------------------------------
[program:test]
command=%(here)s/../scripts/test.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=1
startretries=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(here)s/../logs/test-out.log
stderr_logfile=%(here)s/../logs/test-err.log
environment=TM_NAME="test",TM_INTERVAL="1"

; --- 異常系: 3 tick で exit 42 する。autorestart/startretries の確認用 -----
; 手で起動する: supervisorctl -c configs/supervisord.conf start crash
[program:crash]
command=%(here)s/../scripts/test.sh
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=1
startretries=3
stdout_logfile=%(here)s/../logs/crash-out.log
stderr_logfile=%(here)s/../logs/crash-err.log
environment=TM_NAME="crash",TM_FAIL_AT="3",TM_FAIL_CODE="42"

; --- 異常系: 停止シグナルを無視する。stopwaitsecs 後の SIGKILL 確認用 ------
[program:stubborn]
command=%(here)s/../scripts/test.sh
autostart=false
autorestart=false
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=%(here)s/../logs/stubborn-out.log
stderr_logfile=%(here)s/../logs/stubborn-err.log
environment=TM_NAME="stubborn",TM_IGNORE_STOP="1"
